name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The wheel force-includes the built frontend; tests don't need it,
      # but the editable install fails if the directory is absent. The _app
      # subdir must exist too: app.py mounts it whenever build/ exists.
      - name: Stub frontend build output
        run: mkdir -p cptr/frontend/build/_app

      - name: Run tests
        run: uv run pytest -q
